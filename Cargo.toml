[workspace]
members = ["agentpulse-core"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
repository = "https://github.com/praying-nia/agentpulse-rs"
version = "0.1.0"

[workspace.dependencies]
bitflags = "2"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
