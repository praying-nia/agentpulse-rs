[workspace]
members = [
    "agentpulse-bridge",
    "agentpulse-channels/native",
    "agentpulse-core",
    "agentpulse-host",
    "agentpulse-pairing",
    "agentpulse-protocol",
    "agentpulse-providers/codex",
    "agentpulse-relay",
    "agentpulse-transport",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
repository = "https://github.com/praying-nia/agentpulse-rs"
version = "0.1.0"

[workspace.dependencies]
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v7"] }
webpki-roots = "1"
x509-parser = "0.16"
jsonschema = { version = "0.52", default-features = false }
base64 = "0.22"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
directories = "6"
fs2 = "0.4"
futures = "0.3"
hmac = "0.12"
if-addrs = "0.14"
mdns-sd = "0.17"
qrcode = { version = "0.14", default-features = false }
rand = "0.10"
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
