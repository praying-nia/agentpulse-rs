[workspace]
members = [
    "agentpulse-bridge",
    "agentpulse-core",
    "agentpulse-protocol",
    "agentpulse-providers/codex",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
repository = "https://github.com/praying-nia/agentpulse-rs"
version = "0.1.0"

[workspace.dependencies]
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v7"] }
jsonschema = { version = "0.52", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
