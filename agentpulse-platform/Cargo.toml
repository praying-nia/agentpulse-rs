[package]
name = "agentpulse-platform"
description = "Private local storage and administrative IPC for AgentPulse"
edition.workspace = true
publish.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
sha2.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }

# Only the private Windows FFI module may opt into unsafe. Business crates
# retain the workspace-wide forbid; every FFI call has a local safety argument.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
