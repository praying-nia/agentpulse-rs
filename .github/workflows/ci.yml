name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check repository hygiene
        shell: bash
        run: |
          test -s README.md
          git show --check --format= HEAD

      - name: Verify planned component layout
        shell: bash
        run: |
          test -d agentpulse-bridge
          test -d agentpulse-relay
          test -d agentpulse-core
          test -d agentpulse-protocol
          test -d agentpulse-transport
          test -d agentpulse-providers
          test -d agentpulse-channels
          test ! -e agentpulse-adapters

          providers=(
            codex
            claude-code
            opencode
            deepseek-harness
          )

          channels=(
            native
            feishu
            qq
            webhook
          )

          for provider in "${providers[@]}"; do
            test -d "agentpulse-providers/${provider}"
          done

          for channel in "${channels[@]}"; do
            test -d "agentpulse-channels/${channel}"
          done

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config

      - name: Install stable Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Build workspace
        run: cargo build --release --workspace --all-targets --all-features --locked

      - name: Upload Rust build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event.repository.name }}-rust-${{ github.sha }}
          path: |
            target/release/*
            !target/release/build/**
            !target/release/deps/**
            !target/release/examples/**
            !target/release/incremental/**
          if-no-files-found: warn
          retention-days: 14

      - name: Create CI source snapshot
        id: snapshot
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/${GITHUB_REPOSITORY#*/}-${GITHUB_SHA::12}-source.tar.gz"
          tar --exclude-vcs --exclude=target -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload CI source artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event.repository.name }}-source-${{ github.sha }}
          path: ${{ steps.snapshot.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  deploy:
    name: Deploy production Relay
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: awa
    steps:
      - name: Download tested Rust artifacts
        uses: actions/download-artifact@v6
        with:
          name: ${{ github.event.repository.name }}-rust-${{ github.sha }}
          path: artifact

      - name: Install restricted SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.RELAY_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.RELAY_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/agentpulse-relay-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/agentpulse-relay-deploy" "$HOME/.ssh/known_hosts"

      - name: Stage and activate tested Relay
        env:
          DEPLOY_HOST: ${{ vars.RELAY_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.RELAY_DEPLOY_PORT }}
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          chmod 0755 artifact/agentpulse-relay
          test -x artifact/agentpulse-relay
          scp -P "$DEPLOY_PORT" \
            -i "$HOME/.ssh/agentpulse-relay-deploy" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            artifact/agentpulse-relay \
            "agentpulse-deploy@$DEPLOY_HOST:/var/lib/agentpulse-deploy/incoming/agentpulse-relay-$GITHUB_SHA"
          ssh -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/agentpulse-relay-deploy" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "agentpulse-deploy@$DEPLOY_HOST" \
            sudo /usr/local/sbin/agentpulse-relay-deploy "$GITHUB_SHA"

      - name: Probe public Relay
        env:
          RELAY_ENDPOINT: ${{ vars.RELAY_ENDPOINT }}
        shell: bash
        run: |
          test -n "$RELAY_ENDPOINT"
          artifact/agentpulse-relay probe --endpoint "$RELAY_ENDPOINT"
